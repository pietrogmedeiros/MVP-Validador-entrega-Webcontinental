apiVersion: apps/v1
kind: Deployment
metadata:
  name: validador-app
  namespace: validador
  labels:
    app: validador-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: validador-app
  template:
    metadata:
      labels:
        app: validador-app
    spec:
      containers:
        - name: validador
          image: <your-registry>/validador:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  name: validador-supabase
                  key: SUPABASE_URL
            - name: SUPABASE_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: validador-supabase
                  key: SUPABASE_SERVICE_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 512Mi

